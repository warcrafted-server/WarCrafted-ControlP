# Vhost HTTP; certbot crea el -le-ssl.conf (HTTPS) al emitir el certificado.
# Requiere: a2enmod proxy proxy_http proxy_wstunnel headers rewrite
<VirtualHost *:80>
    ServerName panel.warcrafted.com

    ProxyPreserveHost On
    # WebSockets (consola GM y logs en vivo) antes que la regla general
    ProxyPass /ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8000/ws/
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/panel.warcrafted.com-error.log
    CustomLog ${APACHE_LOG_DIR}/panel.warcrafted.com-access.log combined
</VirtualHost>
