<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
              600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a'
            }
          }
        }
      }
    };
  </script>
  <script>
    if (localStorage.theme === 'dark' ||
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/static/css/style.css?v={{ app_version }}" />
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors">
  {% block body %}{% endblock %}
  <script src="/static/js/theme.js?v={{ app_version }}"></script>
  <script src="/static/js/navbar-loader.js?v={{ app_version }}"></script>
  <script src="/static/js/plugin-loader.js?v={{ app_version }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
