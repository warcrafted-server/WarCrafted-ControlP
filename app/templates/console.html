{% extends "base.html" %}
{% block title %}Consola - {{ app_name }}{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
{% endblock %}
{% block body %}
<div class="h-full flex flex-col">
  <header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <a href="/dashboard" class="text-sm text-brand-600 hover:underline">&larr; Panel</a>
        <h1 class="text-lg font-semibold">Consola GM</h1>
      </div>
      <button id="theme-toggle" type="button"
              class="p-2 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:inline">☀️</span>
      </button>
    </div>
  </header>
  <main class="flex-1 relative overflow-hidden">
    <div id="console-window"
         class="absolute flex flex-col rounded-xl shadow-2xl border border-gray-200 dark:border-gray-800 bg-black overflow-hidden">
      <div id="console-header"
           class="shrink-0 cursor-move select-none flex items-center justify-between px-3 py-2 bg-gray-100 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 text-xs text-gray-600 dark:text-gray-300">
        <span>Consola GM &mdash; {{ instance_id }}</span>
        <span class="text-gray-400">arrastra para mover</span>
      </div>
      <div id="terminal" class="flex-1 min-h-0 p-2"></div>

      <div class="resize-handle" data-dir="n"></div>
      <div class="resize-handle" data-dir="s"></div>
      <div class="resize-handle" data-dir="e"></div>
      <div class="resize-handle" data-dir="w"></div>
      <div class="resize-handle resize-handle-corner" data-dir="ne"></div>
      <div class="resize-handle resize-handle-corner" data-dir="nw"></div>
      <div class="resize-handle resize-handle-corner" data-dir="se"></div>
      <div class="resize-handle resize-handle-corner" data-dir="sw"></div>
    </div>
  </main>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>window.__INSTANCE_ID__ = {{ instance_id | tojson }};</script>
<script src="/static/js/console.js?v={{ app_version }}"></script>
{% endblock %}
